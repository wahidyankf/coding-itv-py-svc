[project]
name = "super-be"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["super_be"]
python_files = ["*_tests.py"]
addopts = "--ignore-glob=*_production_tests.py"
pythonpath = ["."]
markers = ["integration: needs the Postgres container from compose.yaml"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["super_be"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
